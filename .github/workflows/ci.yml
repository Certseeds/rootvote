name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: certseeds/common-actions/actions/checkout@v1
      - uses: certseeds/common-actions/actions/setup-go@v1
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: make generate-data
      - run: GOOS=windows GOARCH=amd64 go build -tags embeddata ./...
