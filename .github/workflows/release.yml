name: release
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "国家/地区,逗号分隔,例如 CN:CN,IN"
        required: true
        default: "CN:CN,IN"
      version:
        description: "版本号"
        required: true
        default: "0.1.0"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: certseeds/common-actions/actions/checkout@v1
      - uses: certseeds/common-actions/actions/setup-go@v1
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: make dist COUNTRIES="${{ inputs.countries }}" VERSION="${{ inputs.version }}"
      - uses: certseeds/common-actions/actions/upload-artifact@v1
        with:
          name: rootvote-windows-amd64
          path: dist/rootvote_*.tgz
