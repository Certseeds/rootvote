name: release
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "国家/地区,逗号分隔,例如 CN:CN,IN"
        required: true
        default: "CN:CN,IN"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: certseeds/common-actions/actions/checkout@v1
      - uses: certseeds/common-actions/actions/setup-nodejs@v1
      - uses: certseeds/common-actions/actions/setup-go@v1
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: make dist COUNTRIES="${{ inputs.countries }}"
      - run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release view "v${VERSION}" >/dev/null 2>&1 || gh release create "v${VERSION}" --generate-notes
          gh release upload "v${VERSION}" "dist/rootvote_${VERSION}_windows_amd64.tgz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
