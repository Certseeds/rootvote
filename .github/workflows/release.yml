name: release
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "国家/地区,逗号分隔,例如 CN:CN,IN"
        required: true
        default: "CN:CN,IN"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: certseeds/common-actions/actions/checkout@v1
      - uses: certseeds/common-actions/actions/setup-nodejs@v1
      # setup-node's pnpm cache expects the store path to exist; no pnpm install is needed here.
      - run: mkdir -p "$(pnpm store path --silent)"
      - uses: certseeds/common-actions/actions/setup-go@v1
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: make dist COUNTRIES="${{ inputs.countries }}"
      - run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" \
            "dist/rootvote_${VERSION}_windows_amd64.tgz" \
            "dist/rootvote_${VERSION}_linux_amd64.tgz" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
